<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALONEMODDER | Dashboard</title>
  <style>
    :root {
      --bg-dark: #080612;
      --panel-bg: rgba(18, 12, 38, 0.75);
      --purple-primary: #7b2cbf;
      --purple-glow: #9d4edd;
      --purple-accent: #3a0ca3;
      --text-main: #ffffff;
      --text-muted: #a0a0c0;
      --border-color: rgba(157, 78, 221, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Banner Header */
    .banner-container {
      width: 100%;
      height: 220px;
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid var(--purple-glow);
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Header Profile */
    .profile-bar {
      max-width: 1200px;
      margin: 0 auto;
      width: 90%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -50px;
      position: relative;
      z-index: 10;
      padding-bottom: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-frame {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #9d4edd, #3a0ca3);
      box-shadow: 0 0 15px var(--purple-glow);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #000;
    }

    .user-details h1 {
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--purple-glow);
    }

    .user-details p {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-family: monospace;
    }

    /* Grid Layout */
    .main-container {
      max-width: 1200px;
      width: 90%;
      margin: 20px auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      flex-grow: 1;
    }

    /* Sidebar Panel */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 0 10px rgba(123, 44, 191, 0.1);
    }

    .brand-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .brand-logo-full {
      width: 100%;
      max-width: 200px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .nav-links {
      list-style: none;
      margin-top: 20px;
    }

    .nav-links li a {
      color: var(--text-main);
      text-decoration: none;
      display: block;
      padding: 10px 15px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 3px solid transparent;
      transition: all 0.3s ease;
    }

    .nav-links li a:hover, .nav-links li a.active {
      background: rgba(157, 78, 221, 0.15);
      border-left: 3px solid var(--purple-glow);
      box-shadow: 0 0 10px rgba(157, 78, 221, 0.2);
    }

    /* Main Content */
    .content-header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .stat-card {
      background: rgba(30, 20, 60, 0.5);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-card h3 {
      font-size: 2rem;
      color: var(--purple-glow);
      text-shadow: 0 0 8px var(--purple-glow);
    }

    .stat-card p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 5px;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
      .profile-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Banner (image.png) -->
  <div class="banner-container">
    <img src="image.png" alt="ALONEMODDER Banner" class="banner-img">
  </div>

  <!-- Header Profile Bar (image3.png) -->
  <div class="profile-bar">
    <div class="user-info">
      <div class="avatar-frame">
        <img src="image3.png" alt="AM Profile Icon" class="avatar-img">
      </div>
      <div class="user-details">
        <h1>ALONEMODDER</h1>
        <p>&gt;_ WE TAKE COMMAND</p>
      </div>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="main-container">
    
    <!-- Sidebar (image2.png) -->
    <aside class="panel">
      <div class="brand-card">
        <img src="image2.png" alt="ALONEMODDER Full Logo" class="brand-logo-full">
      </div>
      <ul class="nav-links">
        <li><a href="#" class="active">Dashboard</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Tools & Mods</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>

    <!-- Content Panel -->
    <main class="panel">
      <div class="content-header">
        <h2>System Overview</h2>
      </div>
      <div class="card-grid">
        <div class="stat-card">
          <h3>100%</h3>
          <p>SYSTEM READY</p>
        </div>
        <div class="stat-card">
          <h3>ACTIVE</h3>
          <p>PURPLE UI THEME</p>
        </div>
        <div class="stat-card">
          <h3>v2.0</h3>
          <p>COMMAND INTERFACE</p>
        </div>
      </div>
    </main>

  </div>

</body>
</html>
